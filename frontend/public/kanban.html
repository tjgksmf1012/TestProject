<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161a" />
<!-- 홈 화면에 추가하면 주소창 없이 전체화면으로 뜬다. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TeamFlow" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/app.css" />
<title>칸반 — TeamFlow</title>
<style>

  /* ══ 브리프대로 다시 짰습니다 (docs/19 §22) ═══════════════════

     머리말(`.head`·`.lede`·`.by`)은 `app.css` 에 있습니다 — 검토
     화면과 **같은 한 벌**입니다.

     여기서 고친 것은 셋입니다:
       열 머리를 가로지르던 **굵은 규칙선 셋**을 걷었고,
       카드 폭을 반씩 채우던 **버튼 밭**을 방향에 따라 갈랐고,
       카드에 이미 있는 말을 화면 위에서 또 하던 **배너**를 뺐습니다. */

  /* ── 대표 주장 한 줄 ───────────────────────────────────
     예전에는 `전체 3 · 완료 1 · 지연 0 · 회의에서 나온 업무 1 ·
     PR이 붙은 업무 1` 이었습니다. 다섯 값이 같은 무게로 나열됐는데,
     앞의 둘은 **바로 아래 열 머리가 이미 세고 있습니다.**

     남긴 셋이 이 화면의 존재 이유입니다 — 회의에서 나와서 PR 로
     끝났는가, 그리고 늦은 것이 있는가. */
  .flow { display: flex; flex-wrap: wrap; gap: var(--sp-4);
          margin: 0 0 var(--sp-6); font-size: var(--fs-caption); color: var(--text-subtle); }
  .flow b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums;
            margin-left: var(--sp-2); }
  .flow .late b { color: var(--gap); }

  /* 좁은 화면에서는 세로로 쌓인다. 폰에서 열어보는 게 기본이다.

     ⚠️ **열 수를 숫자로 박지 마십시오.** `repeat(3, 1fr)` 이었는데
     `TASK-004` 로 넷째 열(`검토 중`)이 생기자 **`완료` 가 아랫줄로
     내려가** `할 일` 밑에 붙었습니다 — 칸반은 왼쪽에서 오른쪽으로 가는
     판인데 완료가 할 일 아래에 있으면 그 뜻이 통째로 깨집니다.
     렌더해서 보고 알았습니다.

     ⚠️ `auto-fit` 도 안 됩니다 — 폭에 따라 **셋이 서고 완료 하나만
     아랫줄**로 떨어집니다(1024px·900px 에서 실측). 고아가 생기는 순간
     같은 결함입니다.

     그래서 나는 자리를 **넷 아니면 둘 아니면 하나**로 못 박습니다.
     둘이면 `할 일·진행 중 / 검토 중·완료` 라 읽는 순서가 유지됩니다.

     ⚠️ 여기 숫자 `4` 는 서버의 `task_service.STATUSES` 와 짝입니다.
     상태가 다섯이 되면 `test_repo_integrity.py` 의 교차 검사가 터집니다. */
  #board { display: grid; gap: var(--sp-5); }
  @media (min-width: 40rem) {
    #board { grid-template-columns: repeat(2, 1fr); align-items: start; }
  }
  @media (min-width: 64rem) {
    #board { grid-template-columns: repeat(4, 1fr); }
  }

  /* ── 열 ────────────────────────────────────────────────

     ⚠️ **열 머리의 굵은 규칙선을 걷었습니다** (브리프 §7). 2px 짜리
     선 셋이 화면을 가로지르며 카드 테두리와 경쟁했습니다. 열을 가르는
     것은 이제 **여백과 카드 면**입니다 — 선이 하나도 없어도 세 덩어리로
     읽힙니다 (렌더해서 확인했습니다).

     ⚠️ 카드는 **남깁니다.** 기여도에서 카드를 걷어낸 이유는 "완결된
     결과처럼 보이는 그릇에 불확실한 값을 담았다" 였습니다. 여기 있는
     것은 진짜로 옮기는 물건이라 카드가 맞는 은유입니다 — 판형을
     맞춘다고 은유까지 갈아 끼우지 않습니다. */
  .col h2 { display: flex; align-items: center; gap: var(--sp-2);
            font-size: var(--fs-caption); font-weight: 600; letter-spacing: .02em;
            color: var(--text-subtle); margin: 0 0 var(--sp-3); }
  /* ⚠️ 한글에 `text-transform: uppercase` 를 걸지 않습니다 — 대문자가
     없어 자간만 벌어집니다 (docs/19 §3 의 v1 실수). */
  .col h2 .n { font-variant-numeric: tabular-nums; color: var(--text-muted);
               background: var(--sunken); border-radius: var(--r-badge);
               padding: 0 var(--sp-2); line-height: 1.6; }
  .col .empty { font-size: var(--fs-caption); color: var(--text-subtle);
                padding: var(--sp-5) 0; margin: 0; text-align: center; }

  /* ── 카드 ──────────────────────────────────────────────
     검토 화면의 후보 카드와 **같은 재료**입니다 — 떠오른 면 + 1px +
     같은 radius. 예전에는 배경이 없어 페이지가 그대로 비쳤습니다. */
  .task { background: var(--surface); border: 1px solid var(--line);
          border-radius: var(--r-card); padding: var(--sp-4);
          margin-bottom: var(--sp-3); transition: border-color .12s ease; }
  @media (hover: hover) and (pointer: fine) {
    .task:hover { border-color: var(--line-strong); }
  }
  /* 근거 링크를 타고 온 카드 (`?task=N`).
     ⚠️ **빨강이 아닙니다.** 이 표시는 "여기입니다" 이지 "잘못됐습니다" 가
     아닙니다. 테두리만 굵게 하고 새 hex 는 만들지 않습니다 —
     `--primary` 는 이미 두 테마에서 대비를 재어 둔 값이고, 이 저장소의
     초점 표시(`app.css` 의 `:focus-visible`)가 쓰는 것과 같습니다.
     ⚠️ `--focus` 라는 토큰을 지어낼 뻔했습니다 — 없는 이름입니다. */
  .task.found { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }

  /* ── 끌어 옮기기 (TASK-005) ──────────────────────────────
     ⚠️ 버튼(.move)은 그대로 있습니다 — 끌기는 마우스 전용 지름길이고
     키보드·터치·낭독기의 길은 버튼입니다. 가드가 짝을 잽니다.
     잡는 손 커서는 정교한 포인터에서만 — 터치에서는 끌기가 안 돕니다. */
  @media (hover: hover) and (pointer: fine) {
    .task[draggable="true"] { cursor: grab; }
    .task[draggable="true"]:active { cursor: grabbing; }
  }
  .task.dragging { opacity: .5; }
  /* 놓을 수 있는 열 표시. --primary 는 .found 와 같은 「여기입니다」 색 —
     새 hex 를 만들지 않습니다. 점선이라 .found 의 실선과 안 헷갈립니다. */
  .col.dropok { outline: 2px dashed var(--primary); outline-offset: 2px;
                border-radius: var(--r-card); }

  .task .title { font-weight: 600; margin: 0 0 var(--sp-1);
                 font-size: var(--fs-item); letter-spacing: var(--ls-item); }
  .task .meta { font-size: var(--fs-caption); color: var(--text-subtle); margin: 0; }

  /* 회의 → 업무 연결이 이 화면의 존재 이유다. 눈에 띄어야 한다. */
  /* ⚠️ `--ico` 만 정하면 안 됩니다 (결함 74). 그 변수를 **읽는** 규칙은
     `app.css` 의 `.ico svg` 하나뿐이고, 이 자리는 `<span class="ico">` 로
     감싸지 않아 그 규칙이 안 걸렸습니다. 값을 정해 놓고 아무도 안 읽는
     상태였고, 아이콘은 294×294 검은 덩어리로 그려졌습니다. */
  .origin .ico, .origin svg { --ico: 14px; width: 14px; height: 14px;
                              display: inline-block; vertical-align: -2px; }
  /* 회의에서 나온 업무 — 이 화면의 존재 이유라 **칩**으로 세웁니다.
     손으로 만든 업무는 아무 표시도 없습니다(기본값이니까) — 그래야
     이 칩이 눈에 띕니다.

     ⚠️ 색을 `--ok`(초록)에서 **브랜드 청록**으로 옮겼습니다. 초록은
     채널 목록에서 이미 "회의가 열려 있다" 이고, 여기서 말하려는 것은
     성공이 아니라 **출처**입니다. 브리프 §15 — 색은 90% 중립, 강조는
     브랜드 하나. */
  .origin { display: flex; align-items: center; gap: var(--sp-icon);
            font-size: var(--fs-caption); margin: var(--sp-3) 0 0; color: var(--primary); }
  .origin .ev { margin-left: auto; color: var(--text-subtle);
                font-variant-numeric: tabular-nums; }

  /* 못 재는 자리 — 문장이 아니라 **표시**. 전문은 접힌 서랍에 있습니다.
     맥락 패널의 측정 불가 점, 기여도의 모르는 폭 막대와 같은 흙빛입니다. */
  /* ⚠️ **못 잰다는 말은 경고가 아닙니다.** 담당자가 없는 업무는 잘못된
     것이 아니라 **누구 기여인지 알 수 없는** 것이고, 이 저장소는 그런
     자리를 결측(흙빛)으로 그리기로 정해 뒀습니다. */
  .gapmark { display: flex; align-items: baseline; gap: var(--sp-2);
             margin: var(--sp-2) 0 0; font-size: var(--fs-caption); color: var(--gap); }
  .gapmark::before { content: ""; flex: 0 0 auto;
                     width: var(--sp-1); height: var(--sp-1); border-radius: var(--r-round);
                     background: currentColor; transform: translateY(-3px); }

  /* ⭐ 여럿이 맡은 업무 — **나눠 셌다**고 카드가 말하는 자리 (`TASK-006`).

     ⚠️ 흙빛(`--gap`)입니다. 빨강이 아닙니다 — 같이 맡은 것은 잘못이
     아니라 사실이고, 이 저장소에서 빨강은 "네가 뭘 잘못했다" 입니다.
     `.gapmark` 와 같은 색을 쓰되 앞의 점은 안 찍습니다: 저건 **못 잰
     자리**의 표시이고 이건 **잰 방법**의 설명이라, 같은 모양으로 그리면
     둘이 같은 종류로 읽힙니다. */
  .task .shared { font-size: var(--fs-caption); color: var(--gap);
                  margin: var(--sp-2) 0 0; }

  /* 담당자를 바꾸는 자리. 접어 둡니다 — 안 접으면 카드마다 이름 목록이
     펼쳐져 보드가 체크박스 밭이 됩니다.

     ⚠️ 칸 하나가 **44px** 입니다. 폰에서 이름이 다닥다닥 붙으면 엉뚱한
     사람을 담당자로 넣게 되고, 담당자는 기여 이벤트가 갈 사람을
     정합니다 — 잘못 누르면 남의 점수가 됩니다. */
  .whoedit { margin-top: var(--sp-3); }
  .whoedit > summary { font-size: var(--fs-caption); color: var(--text-subtle);
                       cursor: pointer; min-height: var(--tap);
                       display: flex; align-items: center; }
  /* ⚠️ **카드마다 붙는 줄**이라 데스크톱에서는 높이를 걷습니다.
     렌더해서 보고 알았습니다 — 44px 짜리 줄이 카드 넷에 하나씩 붙으니
     보드가 눈에 띄게 길어졌고, 정작 매일 하는 일은 카드를 옮기는 것이지
     담당자를 바꾸는 것이 아닙니다. `.moves button` 이 같은 이유로 같은
     처리를 하고 있습니다. **폰에서는 44px 그대로입니다** — 손가락으로
     겨누는 자리이고, 잘못 누르면 남의 점수가 됩니다. */
  @media (hover: hover) and (pointer: fine) {
    .whoedit > summary { min-height: 0; }
    .whoedit > summary:hover { color: var(--text); }
  }
  /* ⚠️ **칸 높이(44px)를 여기 적지 않습니다.** `app.css` 의
     `label:has(> input[type='checkbox'])` 가 이미 그 일을 하고 있습니다 —
     띄우기·간격·글자색까지 한 벌로. 여기 다시 적으면 같은 판단이 두 벌이
     되고, 한쪽만 고쳐지는 날이 옵니다(대표 실패 ②).

     ⚠️ 실제로 한 번 적었다가 지웠습니다. **위반을 심었는데 아무 일도 안
     일어나서** 알았습니다 — 제가 지운 것은 공용 규칙이 이미 하고 있는
     일의 사본이었습니다 (결함 164). */
  .whoedit-body { display: flex; flex-direction: column; }

  /* 이 업무가 어느 PR 로 끝났는가. 대표 주장(회의→업무→GitHub)의 마지막 칸. */
  .gh-list { list-style: none; padding: 0; margin: var(--sp-2) 0 0; font-size: var(--fs-caption); }
  .gh-list li { display: flex; gap: var(--sp-2); padding: var(--sp-1) 0; }
  .gh-list li::before { content: "\2197"; flex: 0 0 auto; }
  /* 확정과 추정을 색으로 나눈다 — 추정을 사실처럼 보이게 하면 안 된다. */
  .gh-list li.sure { color: var(--text-muted); }
  .gh-list li.guess { color: var(--gap); }

  /* ── 옮기기 (브리프 §14) ───────────────────────────────

     ⚠️ 예전에는 `flex: 1 1 auto` 라 버튼 둘이 **카드 폭을 반씩** 채웠습니다.
     44px 짜리 상자 둘이 카드에서 제일 큰 것이었고, 카드 셋이면 큰 상자가
     여섯이라 화면이 버튼 밭이었습니다.

     위계는 **방향**에서 나옵니다 — 앞으로 보내는 것이 이 화면의 주된
     행동이고, 되돌리는 것은 실수를 무를 때만 씁니다. `kanban.ts` 가
     `data-dir` 로 갈라 줍니다.

     ⚠️ 높이는 44px 밑으로 내리되 **포인터가 있을 때만** 입니다. 폰에서
     26px 이었다가 옆 카드의 버튼을 누르던 결함으로 되돌아가면 안 됩니다 —
     칸반에서 그건 엉뚱한 업무를 완료 처리하는 것이고, 완료는 기여
     이벤트를 만듭니다. */
  .moves { display: flex; gap: var(--sp-2); margin-top: var(--sp-4); flex-wrap: wrap; }
  .moves button { flex: 0 0 auto; font-size: var(--fs-label);
                  padding: var(--sp-2) var(--sp-4); }
  .moves button[data-dir="back"] { background: transparent; border-color: transparent;
                                   color: var(--text-subtle); font-weight: 500; }
  /* 지우기 (`TASK-003`) — **되돌리기와 같은 무게**입니다.
     ⚠️ 빨강이 아닙니다. 이 저장소에서 빨강은 "네가 뭘 잘못했다" 이고,
     잘못 만든 카드를 치우는 것은 잘못이 아닙니다.
     ⚠️ 맨 앞에 그리지 않습니다 — 주된 행동은 앞으로 보내는 것입니다.
     `order` 로 눈에 보이는 자리만 뒤로 미룹니다(마크업 순서는 그대로 둬야
     탭 이동이 카드 안에서 자연스럽습니다). */
  .moves .drop { order: 9; background: transparent; border-color: transparent;
                 color: var(--text-subtle); font-weight: 500; margin-left: auto; }
  @media (hover: hover) and (pointer: fine) {
    .moves button { min-height: 0; }
    .moves button[data-dir="back"]:hover { color: var(--text); background: transparent; }
    .moves .drop:hover { color: var(--text); background: transparent; }
  }

  /* ⚠️ 여백을 id(1,0,0)로 적으면 공용 `[role='status']:empty { margin: 0 }`
     을 이겨서, 실패가 없을 때도 빈 줄이 16px 자리를 차지합니다. 비었을 때만
     걷도록 여기서도 같이 적습니다 — 공용 규칙을 강하게 만드는 것보다
     이쪽이 낫습니다(강하게 만들면 다음 화면에서 왜 안 먹는지 또 헤맵니다). */
  #result { font-size: var(--fs-label); color: var(--bad); margin-top: var(--sp-4); }
  #result:empty { margin-top: 0; }
        </style>
</head>
<body>
  <!-- ⭐ **이 화면은 React 가 그립니다** (docs/19 §24).
       머리말·대표 주장 한 줄·보드·읽는 법이 전부 `src/demo/kanban.tsx`
       안에 있습니다. 여기에 같은 마크업을 남겨 두면 **두 벌**이 되고,
       React 가 마운트하는 순간 지워지므로 고쳐도 아무 일이 안 일어납니다. -->
  <div id="app"></div>

  <script type="module" src="/kanban.js"></script>

  <!-- 아래 탭바. `src/demo/nav.ts` 가 채운다.
       위쪽 링크 줄에 의존하면 전체화면 PWA·WebView 에서 갇힌다 —
       거기에는 주소창도 뒤로가기도 없다. -->
  <!-- 탭 넷 **말고** 가는 곳. `src/demo/nav.ts` 가 `navLinks` 로 채운다.
       ⛔ 이 자리를 지우면 채팅·일정·알림·활동·찾기·보고서로 **가는 길이
       제품 전체에서 사라집니다** — 실제로 그랬습니다 (결함 305). -->
  <nav id="nav" aria-label="더 보기"></nav>

  <nav id="tabs" aria-label="주요 화면"></nav>
</body>
</html>
