<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161a" />
<!-- 홈 화면에 추가하면 주소창 없이 전체화면으로 뜬다. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TeamFlow" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/app.css" />
<title>칸반 — TeamFlow</title>
<style>

  /* ⚠️ 노란 배너를 뺐습니다 (docs/19 §18). 카드에 이미 흙빛 표시가
     있는데 화면 위에 또 노란 띠를 깔면 같은 말이 두 번이고, 색이 강해서
     **보드보다 배너가 먼저** 읽힙니다. 같은 흙빛 어휘로 낮춥니다. */
  #unassigned { margin: var(--sp-3) 0; padding: var(--sp-1) 0 var(--sp-1) var(--sp-3);
                border-left: 2px solid var(--gap);
                font-size: var(--fs-caption); color: var(--text-muted); }

  /* 좁은 화면에서는 세로로 쌓인다. 폰에서 열어보는 게 기본이다. */
  #board { display: grid; gap: var(--sp-4); margin-top: var(--sp-4); }
  @media (min-width: 46rem) { #board { grid-template-columns: repeat(3, 1fr); align-items: start; } }

  /* ══ 제도 도면 어휘로 (docs/19 §17) ═══════════════════════

     ⚠️ **열 상자를 걷어냈습니다.** 회색 둥근 상자 셋은 어느 보드
     화면과도 구분되지 않았고, 기여도를 규칙선으로 바꾸면서 한 제품
     안에 판형이 두 벌이 됐습니다. 열은 이제 **머리 규칙선 하나**입니다.

     ⚠️ 카드는 **남깁니다.** 기여도에서 카드를 걷어낸 이유는 "완결된
     결과처럼 보이는 그릇에 불확실한 값을 담았다" 였습니다. 여기 있는
     것은 진짜로 옮기는 물건이라 카드가 맞는 은유입니다 — 판형을
     맞춘다고 은유까지 갈아 끼우지 않습니다. */
  .col { padding: 0; }
  .col h2 { display: flex; align-items: baseline; justify-content: space-between;
            font-size: var(--fs-label); letter-spacing: .04em; color: var(--text-muted);
            margin: 0 0 var(--sp-3); padding-bottom: var(--sp-2);
            border-bottom: 2px solid var(--text); }
  /* ⚠️ 한글에 `text-transform: uppercase` 를 걸지 않습니다 — 대문자가
     없어 자간만 벌어집니다 (docs/19 §3 의 v1 실수). */
  .col h2 .n { font-variant-numeric: tabular-nums; color: var(--text-subtle); }

  .task { border: 1px solid var(--line); border-radius: var(--r-ctrl);
          padding: var(--sp-3); margin-bottom: var(--sp-3); }
  .task .title { font-weight: 600; margin: 0 0 var(--sp-1); font-size: var(--fs-body); }
  .task .meta { font-size: var(--fs-label); color: var(--text-subtle); margin: 0; }

  /* 회의 → 업무 연결이 이 화면의 존재 이유다. 눈에 띄어야 한다. */
  /* ⚠️ `--ico` 만 정하면 안 됩니다 (결함 74). 그 변수를 **읽는** 규칙은
     `app.css` 의 `.ico svg` 하나뿐이고, 이 자리는 `<span class="ico">` 로
     감싸지 않아 그 규칙이 안 걸렸습니다. 값을 정해 놓고 아무도 안 읽는
     상태였고, 아이콘은 294×294 검은 덩어리로 그려졌습니다. */
  .origin .ico, .origin svg { --ico: 14px; width: 14px; height: 14px;
                              display: inline-block; vertical-align: -2px; }
  /* 회의에서 나온 업무 — 이 화면의 존재 이유라 **칩**으로 세웁니다.
     손으로 만든 업무는 아무 표시도 없습니다(기본값이니까) — 그래야
     이 칩이 눈에 띕니다. */
  .origin { display: flex; align-items: center; gap: var(--sp-icon);
            font-size: var(--fs-caption); margin: var(--sp-2) 0 0; color: var(--ok); }
  .origin .ev { margin-left: auto; color: var(--text-subtle);
                font-variant-numeric: tabular-nums; }

  /* 못 재는 자리 — 문장이 아니라 **표시**. 전문은 접힌 서랍에 있습니다.
     맥락 패널의 측정 불가 점, 기여도의 모르는 폭 막대와 같은 흙빛입니다. */
  .gapmark { margin: var(--sp-2) 0 0; padding-left: var(--sp-2);
             border-left: 2px solid var(--gap);
             font-size: var(--fs-caption); color: var(--text-muted); }

  /* ⚠️ **못 잰다는 말은 경고가 아닙니다.** 담당자가 없는 업무는 잘못된
     것이 아니라 **누구 기여인지 알 수 없는** 것이고, 이 저장소는 그런
     자리를 결측(흙빛)으로 그리기로 정해 뒀습니다. 노랑 삼각형은 "네가
     뭘 잘못했다" 로 읽힙니다. 왼쪽 흙빛 막대로 바꿉니다. */


  /* 이 업무가 어느 PR 로 끝났는가. 대표 주장(회의→업무→GitHub)의 마지막 칸. */
  .gh { font-size: var(--fs-caption); margin: var(--sp-2) 0 0; color: var(--text-subtle); }
  .gh-list { list-style: none; padding: 0; margin: var(--sp-1) 0 0; font-size: var(--fs-caption); }
  .gh-list li { padding: var(--sp-1) 0; }
  .gh-list li::before { content: "⎇ "; }
  /* 확정과 추정을 색으로 나눈다 — 추정을 사실처럼 보이게 하면 안 된다. */
  .gh-list li.sure { color: var(--ok); }
  .gh-list li.guess { color: var(--warn); }

  .moves { display: flex; gap: .375rem; margin-top: var(--sp-2); flex-wrap: wrap; }
  /* ⭐ 예전에는 높이 26px 이었다. 손가락 끝 접촉면이 대략 44px 이라
     그보다 작으면 **옆 카드의 버튼을 누른다** — 칸반에서 그건 엉뚱한
     업무를 완료 처리하는 것이고, 완료는 기여 이벤트를 만든다.
     크기는 app.css 의 button 규칙(min-height: var(--tap))이 정하고,
     여기서는 한 줄에 몇 개가 들어가는지만 정한다. */
  .moves button { flex: 1 1 auto; font-size: var(--fs-label); padding-inline: var(--sp-3); }

  #result { font-size: var(--fs-label); color: var(--bad); margin-top: var(--sp-4); }
    </style>
</head>
<body>
  <h1>칸반</h1>
  <p class="sub" id="who"></p>
  <p class="sub" id="counts"></p>

  <div id="unassigned" hidden></div>
  <div id="board" class="board"></div>
  <p id="result"></p>

  <details class="more">
    <summary>이 화면을 읽는 법</summary>
    <div class="more-body">
      <p>
        말풍선 표시가 붙은 업무는 <strong>회의에서 나온 결정</strong>이 사람의
        승인을 거쳐 여기까지 온 것입니다. 근거 발화까지 거슬러 올라갈 수
        있습니다 — 그게 이 프로젝트가 하려는 일입니다.
      </p>
      <p>
        업무를 <strong>완료</strong>로 옮기면 그 시점에 기여 이벤트가 만들어지고
        기여도 화면에 반영됩니다. 마감일이 있으면 지켰는지도 같이 기록됩니다.
        담당자가 없는 업무는 누구의 기여인지 알 수 없어 반영되지 않습니다.
      </p>
    </div>
  </details>

  <script type="module" src="/kanban.js"></script>

  <!-- 아래 탭바. `src/demo/nav.ts` 가 채운다.
       위쪽 링크 줄에 의존하면 전체화면 PWA·WebView 에서 갇힌다 —
       거기에는 주소창도 뒤로가기도 없다. -->
  <nav id="tabs" aria-label="주요 화면"></nav>
</body>
</html>
