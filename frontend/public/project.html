<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161a" />
<!-- 홈 화면에 추가하면 주소창 없이 전체화면으로 뜬다. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TeamFlow" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/app.css" />
<title>프로젝트 설정 — TeamFlow</title>
<style>
  /* 되돌릴 수 없는 동작. 다른 구역과 눈에 띄게 달라야 하지만,
     겁주는 붉은 상자로 만들지는 않는다 — 이건 권리 행사다. */
  .danger { border: 1px solid color-mix(in srgb, var(--bad) 35%, var(--line)); }
  .danger .label { font-size: var(--fs-label); font-weight: 600; color: var(--text-subtle); margin: var(--sp-4) 0 .25rem; }
  .danger ul.plain li { font-size: var(--fs-label); color: var(--text-subtle); padding: var(--sp-1) 0; }
  .danger ul.plain li::before { content: "· "; }
  .danger-btn { margin-top: var(--sp-4); border-color: var(--bad); color: var(--bad); }
  /* ⚠️ `margin-top` 을 여기 적으면 안 됩니다 — 이 자리는 `.status` 이고
     그 규칙이 같은 값을 이미 줍니다. id(1,0,0)로 다시 적으면 공용
     `[role='status']:empty { margin: 0 }` 을 이겨서, 안내가 없을 때도
     빈 줄이 12px 자리를 차지합니다. 크기만 남깁니다. */
  #del-result { font-size: var(--fs-body); }
  #del-result.bad { color: var(--bad); }


  #code { font: 700 1.5rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
  /* 코드가 **없을 때**는 코드 조판을 벗긴다. 안 그러면 `(없음)` 이 값처럼
     읽힌다 (결함 71 의 뒷면). */
  #code.none { font: inherit; letter-spacing: normal; color: var(--text-subtle); }
  #next { font-size: var(--fs-label); margin: var(--sp-2) 0 0; }
  .meta-line { font-size: var(--fs-caption); color: var(--text-subtle); margin: 0 0 var(--sp-5); }

  /* 연결 진단. 심각도에 따라 왼쪽 띠 색만 바뀐다 — 상자 전체를 붉게
     칠하면 경고와 오류가 같은 무게로 보이고, 둘 다 무시하게 된다. */
  /* ⚠️ **테두리 상자를 걷었습니다** (브리프 §22 — 카드 안 카드).
     패널 안에 또 액자가 있으니 화면에 상자가 이중이었습니다. 심각도는
     왼쪽 띠 하나가 말합니다 — 상자 전체를 붉게 칠하면 경고와 오류가
     같은 무게로 보이고, 둘 다 무시하게 됩니다. */
  .health { margin-top: var(--sp-5); padding: var(--sp-1) 0 var(--sp-1) var(--sp-4);
            border-left: 2px solid var(--line); }
  .health.ok   { border-left-color: var(--ok); }
  .health.warn { border-left-color: var(--warn); }
  .health.bad  { border-left-color: var(--bad); }
  .health-headline { font-size: var(--fs-body); font-weight: 600; margin: 0; }
  .health-detail { font-size: var(--fs-label); color: var(--text-subtle); margin: .375rem 0 0; }
  /* 지금 할 일. 이것만 눈에 들어와도 고칠 수 있어야 한다. */
  .health-next { font-size: var(--fs-label); margin: var(--sp-2) 0 0; font-weight: 600; }
  .health-warnings { margin: var(--sp-2) 0 0; }
  .health-warnings li { font-size: var(--fs-label); color: var(--text-subtle); padding: var(--sp-1) 0; }
  .health-warnings li::before { content: "⚠ "; }
  .health-activity { font-size: var(--fs-caption); color: var(--text-subtle); margin: var(--sp-2) 0 0; }
  .health code { font: inherit; font-weight: 700; }
  #error { color: var(--bad); font-size: var(--fs-label); margin-top: var(--sp-4); }

  /* 역할 — 한 줄 = 한 역할. 합이 눈에 보여야 1 을 맞출 수 있다.
     ⚠️ **줄마다 긋던 가로선을 걷었습니다** (브리프 §7). 역할 셋에 선이
     둘인데, 그 선이 값보다 진했습니다. */
  .roles label { display: grid; grid-template-columns: 5rem 4.5rem 1fr; gap: var(--sp-3);
                 align-items: center; padding: var(--sp-1) 0;
                 font-size: var(--fs-label); }
  /* ⚠️ 입력창 **글자**는 16px 밑으로 안 내립니다 — iOS Safari 가 확대하고
     돌아오지 않습니다. 줄이는 것은 높이와 폭뿐입니다.

     ⚠️ `.roles input` 은 (0,1,1) 이라 `app.css` 의
     `input:not([type='checkbox']):not([type='radio'])`(0,2,1) 에 집니다.
     `[type="number"]` 를 붙여 (0,2,1) 로 맞췄습니다.

     ⚠️ **그런데 그것만으로는 안 줄었습니다.** `min-height: 0` 이 먹었는데도
     45px 그대로여서 재 봤더니, 높이가 `min-height` 가 아니라 **내용**에서
     나오고 있었습니다 — 글자 16px 에 `body` 에서 물려받은
     `line-height: 1.7` 이면 27px, 거기에 여백 16 + 테두리 2 = 45px 입니다.
     특성도를 의심했는데 원인은 행간이었습니다. 재 보지 않았으면
     선택자만 계속 고쳤을 것입니다.

     ⚠️ 높이를 줄이는 것은 **포인터가 있을 때만**입니다. 손가락 끝
     접촉면은 44px 이고, 여기서 그보다 작아지면 옆 칸을 누릅니다. */
  .roles input[type="number"] { font-size: var(--fs-input); text-align: right; }
  #gh-login { max-width: 20rem; }
  @media (hover: hover) and (pointer: fine) {
    .roles input[type="number"], #gh-login, #meeting-title, #title, #repo {
      min-height: 0; padding: var(--sp-2) var(--sp-3); line-height: 1.4;
    }
  }
  .roles .hint { font-size: var(--fs-caption); color: var(--text-subtle); }
  .rolesum { font-size: var(--fs-label); color: var(--text-subtle); margin: var(--sp-2) 0; }
  .rolesum.bad { color: var(--bad); }
  .rolestatus { font-size: var(--fs-label); color: var(--text-subtle); margin: var(--sp-3) 0 0; }
  /* ⚠️ 이 한 줄이 없으면 `.bad` 를 붙여도 회색으로 남습니다 (결함 98).
     `app.css` 의 `.bad` 와 특이도가 같은데, 화면별 <style> 이 **뒤에**
     오므로 `.rolestatus` 가 이깁니다 — 결함 61 과 같은 부류입니다.
     `.rolesum.bad` 와 `#del-result.bad` 는 이미 이렇게 적혀 있었고,
     이 자리만 빠져 있었습니다. */
  .rolestatus.bad { color: var(--bad); }

  /* ⚠️ 설명문 줄 길이를 묶습니다 (브리프 §16). 1920px 에서 한 줄이
     화면 폭을 다 썼습니다 — `내 역할만 바꿉니다. 역할은 가중치를 바꾸고
     …` 가 한 줄에 60자였고, 그 줄 끝에서 다음 줄 첫 글자를 못 찾습니다.
     `ch` 가 아니라 `rem` 인 이유는 `app.css` 의 `.lede` 주석에 있습니다. */
  /* `.panel > .note` 의 여백·줄 길이는 **`app.css` 에 있습니다** —
     녹음 화면에도 같은 것이 필요해서 옮겼습니다. */
  .panel > .sub { max-width: 44rem; }

  /* 저장 버튼은 **보조**입니다 (브리프 §14). 이 화면의 주 행동은
     `회의를 열고 로비로` 하나뿐이고, 나머지는 값을 고친 뒤 눌러
     확정하는 것입니다. 여섯 개가 다 청록이면 주 행동이 사라집니다. */
  .panel > button:not(.primary) { min-height: 0; font-size: var(--fs-label);
                                  padding: var(--sp-2) var(--sp-4); margin-top: var(--sp-4); }
</style>
</head>
<body>
  <!-- ⭐ **이 화면은 React 가 그립니다** (docs/19 §24).
       역할·GitHub 계정·초대 코드·회의 열기·설정·연결 진단·내 녹음 지우기가
       전부 `src/demo/project.tsx` 안에 있습니다. -->
  <div id="app"></div>

  <script type="module" src="/project.js"></script>

  <!-- 아래 탭바. `src/demo/nav.ts` 가 채운다.
       위쪽 링크 줄에 의존하면 전체화면 PWA·WebView 에서 갇힌다 —
       거기에는 주소창도 뒤로가기도 없다. -->
  <nav id="tabs" aria-label="주요 화면"></nav>
</body>
</html>
