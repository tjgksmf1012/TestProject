<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>프로젝트 설정 — TeamFlow</title>
<style>
  :root { color-scheme: light dark; --line: #d8dbe0; --dim: #6b7280; --bad: #b91c1c; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --line: #3a3f47; --dim: #9aa2ad; --bad: #f87171; --accent: #60a5fa; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1rem; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; max-width: 34rem; margin-inline: auto; }
  nav#nav { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin: 0 0 1rem; font-size: .8125rem; }
  nav#nav a { padding: .2rem .55rem; border: 1px solid var(--line); border-radius: .35rem; text-decoration: none; color: inherit; opacity: .85; }
  nav#nav .miss { color: var(--dim); }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .sub { color: var(--dim); font-size: .875rem; margin: 0 0 1.25rem; }
  section { border: 1px solid var(--line); border-radius: .625rem; padding: .875rem 1rem; margin-bottom: 1rem; }
  h2 { font-size: .8125rem; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); margin: 0 0 .625rem; }
  label { display: block; font-size: .8125rem; color: var(--dim); margin-bottom: .625rem; }
  input { display: block; width: 100%; margin-top: .25rem; padding: .55rem .65rem; font: inherit; border: 1px solid var(--line); border-radius: .4rem; background: transparent; color: inherit; }
  button { font: inherit; font-size: .875rem; padding: .5rem .9rem; border: 1px solid var(--line); border-radius: .4rem; background: transparent; color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  #code { font: 700 1.5rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
  #next { font-size: .875rem; margin: .5rem 0 0; }
  #gh-state, #members { font-size: .8125rem; color: var(--dim); margin: .25rem 0 0; }
  #error { color: var(--bad); font-size: .875rem; margin-top: 1rem; }
  .note { font-size: .8125rem; color: var(--dim); margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
</style>
</head>
<body>
  <nav id="nav"></nav>
  <h1 id="title-heading">프로젝트</h1>
  <p class="sub" id="members"></p>

  <section>
    <h2>팀원 초대</h2>
    <p id="code">····</p>
    <div class="row">
      <button id="copy" type="button">코드 복사</button>
      <button id="rotate" type="button">코드 새로 만들기</button>
    </div>
    <p id="next"></p>
  </section>

  <section>
    <h2>회의 열기</h2>
    <label>회의 제목 (선택)
      <input id="meeting-title" type="text" placeholder="1주차 정기회의" />
    </label>
    <button id="open-meeting" class="primary" type="button">회의를 열고 로비로</button>
  </section>

  <section>
    <h2>설정</h2>
    <label>프로젝트 이름
      <input id="title" type="text" />
    </label>
    <button id="save-title" type="button">이름 저장</button>

    <label style="margin-top:1rem">GitHub 저장소
      <input id="repo" type="text" placeholder="owner/repo" />
    </label>
    <button id="save-repo" type="button">저장소 연결</button>
    <p id="gh-state"></p>
  </section>

  <p id="error" hidden></p>

  <p class="note">
    초대 코드는 <strong>메신저로 돌아다니므로 샙니다.</strong> 팀이 다 모이면
    새로 만들어 두는 게 좋습니다 — 지금 코드는 그 즉시 통하지 않습니다.
    <br /><br />
    저장소는 <code>owner/repo</code> 형식입니다. 주소를 붙여넣어도 고쳐서
    저장합니다 — 웹훅이 <code>repository.full_name</code> 으로 프로젝트를
    찾기 때문에, 형식이 틀리면 <strong>오류 없이 기여도만 비어 있게</strong>
    됩니다.
  </p>

  <script type="module" src="/project.js"></script>
</body>
</html>
