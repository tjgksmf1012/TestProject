<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161a" />
<!-- 홈 화면에 추가하면 주소창 없이 전체화면으로 뜬다. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TeamFlow" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/app.css" />
<title>프로젝트 설정 — TeamFlow</title>
<style>
  /* 되돌릴 수 없는 동작. 다른 구역과 눈에 띄게 달라야 하지만,
     겁주는 붉은 상자로 만들지는 않는다 — 이건 권리 행사다. */
  .danger { border: 1px solid color-mix(in srgb, var(--bad) 35%, var(--line)); }
  .danger .label { font-size: var(--fs-label); font-weight: 600; color: var(--text-subtle); margin: var(--sp-4) 0 .25rem; }
  .danger ul.plain li { font-size: var(--fs-label); color: var(--text-subtle); padding: var(--sp-1) 0; }
  .danger ul.plain li::before { content: "· "; }
  .danger-btn { margin-top: var(--sp-4); border-color: var(--bad); color: var(--bad); }
  /* ⚠️ `margin-top` 을 여기 적으면 안 됩니다 — 이 자리는 `.status` 이고
     그 규칙이 같은 값을 이미 줍니다. id(1,0,0)로 다시 적으면 공용
     `[role='status']:empty { margin: 0 }` 을 이겨서, 안내가 없을 때도
     빈 줄이 12px 자리를 차지합니다. 크기만 남깁니다. */
  #del-result { font-size: var(--fs-body); }
  #del-result.bad { color: var(--bad); }


  #code { font: 700 1.5rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
  /* 코드가 **없을 때**는 코드 조판을 벗긴다. 안 그러면 `(없음)` 이 값처럼
     읽힌다 (결함 71 의 뒷면). */
  #code.none { font: inherit; letter-spacing: normal; color: var(--text-subtle); }
  #next { font-size: var(--fs-label); margin: var(--sp-2) 0 0; }
  .meta-line { font-size: var(--fs-caption); color: var(--text-subtle); margin: 0 0 var(--sp-5); }

  /* 연결 진단. 심각도에 따라 왼쪽 띠 색만 바뀐다 — 상자 전체를 붉게
     칠하면 경고와 오류가 같은 무게로 보이고, 둘 다 무시하게 된다. */
  /* ⚠️ **테두리 상자를 걷었습니다** (브리프 §22 — 카드 안 카드).
     패널 안에 또 액자가 있으니 화면에 상자가 이중이었습니다. 심각도는
     왼쪽 띠 하나가 말합니다 — 상자 전체를 붉게 칠하면 경고와 오류가
     같은 무게로 보이고, 둘 다 무시하게 됩니다. */
  .health { margin-top: var(--sp-5); padding: var(--sp-1) 0 var(--sp-1) var(--sp-4);
            border-left: 2px solid var(--line); }
  .health.ok   { border-left-color: var(--ok); }
  .health.warn { border-left-color: var(--warn); }
  .health.bad  { border-left-color: var(--bad); }
  .health-headline { font-size: var(--fs-body); font-weight: 600; margin: 0; }
  .health-detail { font-size: var(--fs-label); color: var(--text-subtle); margin: .375rem 0 0; }
  /* 지금 할 일. 이것만 눈에 들어와도 고칠 수 있어야 한다. */
  .health-next { font-size: var(--fs-label); margin: var(--sp-2) 0 0; font-weight: 600; }
  .health-warnings { margin: var(--sp-2) 0 0; }
  .health-warnings li { font-size: var(--fs-label); color: var(--text-subtle); padding: var(--sp-1) 0; }
  .health-warnings li::before { content: "⚠ "; }
  .health-activity { font-size: var(--fs-caption); color: var(--text-subtle); margin: var(--sp-2) 0 0; }
  .health code { font: inherit; font-weight: 700; }
  #error { color: var(--bad); font-size: var(--fs-label); margin-top: var(--sp-4); }

  /* 역할 — 한 줄 = 한 역할. 합이 눈에 보여야 1 을 맞출 수 있다.
     ⚠️ **줄마다 긋던 가로선을 걷었습니다** (브리프 §7). 역할 셋에 선이
     둘인데, 그 선이 값보다 진했습니다. */
  .roles label { display: grid; grid-template-columns: 5rem 4.5rem 1fr; gap: var(--sp-3);
                 align-items: center; padding: var(--sp-1) 0;
                 font-size: var(--fs-label); }
  /* ⚠️ 입력창 **글자**는 16px 밑으로 안 내립니다 — iOS Safari 가 확대하고
     돌아오지 않습니다. 줄이는 것은 높이와 폭뿐입니다.

     ⚠️ `.roles input` 은 (0,1,1) 이라 `app.css` 의
     `input:not([type='checkbox']):not([type='radio'])`(0,2,1) 에 집니다.
     `[type="number"]` 를 붙여 (0,2,1) 로 맞췄습니다.

     ⚠️ **그런데 그것만으로는 안 줄었습니다.** `min-height: 0` 이 먹었는데도
     45px 그대로여서 재 봤더니, 높이가 `min-height` 가 아니라 **내용**에서
     나오고 있었습니다 — 글자 16px 에 `body` 에서 물려받은
     `line-height: 1.7` 이면 27px, 거기에 여백 16 + 테두리 2 = 45px 입니다.
     특성도를 의심했는데 원인은 행간이었습니다. 재 보지 않았으면
     선택자만 계속 고쳤을 것입니다.

     ⚠️ 높이를 줄이는 것은 **포인터가 있을 때만**입니다. 손가락 끝
     접촉면은 44px 이고, 여기서 그보다 작아지면 옆 칸을 누릅니다. */
  .roles input[type="number"] { font-size: var(--fs-input); text-align: right; }
  #gh-login { max-width: 20rem; }
  @media (hover: hover) and (pointer: fine) {
    .roles input[type="number"], #gh-login, #meeting-title, #title, #repo {
      min-height: 0; padding: var(--sp-2) var(--sp-3); line-height: 1.4;
    }
  }
  .roles .hint { font-size: var(--fs-caption); color: var(--text-subtle); }
  .rolesum { font-size: var(--fs-label); color: var(--text-subtle); margin: var(--sp-2) 0; }
  .rolesum.bad { color: var(--bad); }
  .rolestatus { font-size: var(--fs-label); color: var(--text-subtle); margin: var(--sp-3) 0 0; }
  /* ⚠️ 이 한 줄이 없으면 `.bad` 를 붙여도 회색으로 남습니다 (결함 98).
     `app.css` 의 `.bad` 와 특이도가 같은데, 화면별 <style> 이 **뒤에**
     오므로 `.rolestatus` 가 이깁니다 — 결함 61 과 같은 부류입니다.
     `.rolesum.bad` 와 `#del-result.bad` 는 이미 이렇게 적혀 있었고,
     이 자리만 빠져 있었습니다. */
  .rolestatus.bad { color: var(--bad); }

  /* ⚠️ 설명문 줄 길이를 묶습니다 (브리프 §16). 1920px 에서 한 줄이
     화면 폭을 다 썼습니다 — `내 역할만 바꿉니다. 역할은 가중치를 바꾸고
     …` 가 한 줄에 60자였고, 그 줄 끝에서 다음 줄 첫 글자를 못 찾습니다.
     `ch` 가 아니라 `rem` 인 이유는 `app.css` 의 `.lede` 주석에 있습니다. */
  /* `.panel > .note` 의 여백·줄 길이는 **`app.css` 에 있습니다** —
     녹음 화면에도 같은 것이 필요해서 옮겼습니다. */
  .panel > .sub { max-width: 44rem; }

  /* 프로젝트 상태 (정의서 §18).
     ⚠️⚠️ **막대를 그리지 마십시오.** 사람별 미완료 건수를 같은 축 위에
     늘어놓으면 그게 곧 순위표입니다 — 이 저장소가 두 번 어긴 규칙이고,
     여기는 그중에서도 제일 위험한 자리입니다(부하는 성적으로 읽힙니다).
     값은 **글자로**, 목록은 **이름 순** 그대로. */
  .sub-head { font-size: var(--fs-caption); font-weight: 600; color: var(--text-subtle);
              letter-spacing: .02em; margin: var(--sp-5) 0 var(--sp-2); }
  .prog { font-size: var(--fs-body); color: var(--text); margin: var(--sp-2) 0 0;
          font-variant-numeric: tabular-nums; }
  /* ⚠️ 마감이 지난 건수도 **빨강이 아닙니다.** 이 저장소에서 빨강은
     "네가 뭘 잘못했다" 로 읽히는데, 이건 팀이 같이 보는 사실입니다. */
  .prog-late { font-size: var(--fs-label); color: var(--text-muted); margin: var(--sp-1) 0 0; }

  .loads { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap;
           gap: var(--sp-2) var(--sp-5); font-size: var(--fs-label); }
  .loads li { display: flex; gap: var(--sp-1); align-items: baseline; }
  .lname { color: var(--text-muted); }
  .lnum { color: var(--text); font-weight: 600; }
  /* 담당자 없는 것. ⚠️ 흙빛(`--gap`)입니다 — 빨강이 아닙니다.
     "아직 아무도 안 맡았다" 는 잘못이 아니라 **빈 자리**입니다. */
  .lnone .lname, .lnone .lnum { color: var(--gap); }

  /* ── 회의 개선 추세 (REVIEW-006) ────────────────────────
     ⚠️ 막대·점 없음 — 값은 글자로. 종류마다 한 줄이고 굵기도 같습니다
     (굵히면 큰 값이 먼저 읽혀 순위처럼 보입니다). */
  .trends { list-style: none; padding: 0; margin: 0; display: flex;
            flex-direction: column; gap: var(--sp-1);
            font-size: var(--fs-label); color: var(--text-muted); }
  /* 못 재는 이유 — 흙빛. 회의가 아직 적은 것은 잘못이 아닙니다. */
  .tnote { font-size: var(--fs-label); color: var(--gap); margin: 0; }

  .rlist { list-style: none; padding: 0; margin: 0;
           display: flex; flex-direction: column; gap: var(--sp-4); }
  .rname { font-size: var(--fs-label); font-weight: 600; color: var(--text); margin: 0; }
  .rwhy { font-size: var(--fs-caption); color: var(--text-muted); margin: var(--sp-1) 0 0;
          font-variant-numeric: tabular-nums; }
  /* ── 팀원과 권한 (`PROJECT-003`·`PROJECT-004`) ─────────── */
  /* ⚠️ **줄을 세우지 않습니다.** 서버가 주는 순서 그대로입니다 — 권한 순
     으로 정렬하면 맨 위가 "제일 높은 사람" 이 되고, 이 화면이 만들면 안
     되는 그림입니다. */
  .mlist { list-style: none; padding: 0; margin: var(--sp-3) 0 0;
           display: flex; flex-direction: column; gap: var(--sp-2); }
  .mlist li { display: flex; align-items: center; gap: var(--sp-3);
              flex-wrap: wrap; min-height: var(--tap); }
  .mname { font-size: var(--fs-item); color: var(--text); }
  /* 지금 붙어 있는가 (`USER-005`).
     ⚠️ **오프라인에는 아무 표시도 안 붙습니다** — 클래스가 없으면 이
     규칙이 아예 안 걸립니다. 회색 점을 찍어 "없음" 을 세게 만들지
     않습니다.
     ⚠️ 빨강·초록 신호등을 안 씁니다. 색으로 좋고 나쁨을 말하는 순간
     자리에 없는 것이 잘못이 됩니다. `--primary` 하나만 씁니다. */
  .pdot { display: inline-block; width: 8px; height: 8px;
          border-radius: var(--r-round); margin-right: var(--sp-2);
          vertical-align: middle; }
  .pdot.here { background: var(--primary); }
  /* 자리 비움은 **속이 빈 점** — 형태로 말합니다. */
  .pdot.away { border: 1.5px solid var(--primary); }
  /* ⚠️ 점만 찍으면 색을 못 보는 사람에게는 아무 표시도 없는 것입니다. */
  .pstat { margin-left: var(--sp-2); font-size: var(--fs-caption);
           color: var(--text-subtle); }
  /* 내 줄을 알아보게. ⚠️ 색이 아니라 **글자**로 말합니다 — 색만으로
     구분하면 색을 못 보는 사람에게는 아무 표시도 없는 것입니다. */
  .mme { margin-left: var(--sp-2); font-size: var(--fs-caption);
         color: var(--text-subtle); }
  /* ⚠️ **공용 CSS 가 `select` 에 `width: 100%` 를 줍니다.** 그대로 두면
     칸이 줄 전체를 먹고, 이름·권한·버튼이 한 줄에서 **세 줄로 흩어집니다.**
     렌더해서 보기 전에는 안 보였습니다 — 값은 다 맞았고 배치만 틀렸습니다.
     `AGENTS.md` 가 경고하는 그 자리(공용 규칙이 화면 칸을 부풀리는 것)입니다. */
  .mrole { margin-left: auto; width: auto; min-width: 7rem; }
  /* 못 바꾸는 사람의 등급 — 잠긴 select 대신 **글자**입니다.
     ⚠️ `disabled` 된 select 를 두면 "눌리는데 안 눌린다" 로 읽힙니다. */
  .mrole-flat { margin-left: auto; font-size: var(--fs-caption);
                color: var(--text-subtle); }
  /* ⚠️ 되돌릴 수 없는 행동이라 **주된 버튼처럼 보이면 안 됩니다.**
     빨강도 아닙니다 — 이 저장소에서 빨강은 "네가 뭘 잘못했다" 입니다. */
  .mout { font-size: var(--fs-caption); }
  .leave { margin-top: var(--sp-2); }

  /* 근거로 든 업무 — **누르면 그 카드로 갑니다.**
     ⚠️ 처음엔 글자 그대로 두었더니 폰에서 접촉면이 13×14px 이었고 이웃과
     6.4px 떨어져 있었습니다. 옆 것을 누릅니다. 누르는 것은 `--tap`(44px)
     이 하한이라는 것이 이 저장소의 규칙입니다 (`docs/14` §5.3).
     ⚠️ 쉼표를 글자로 넣지 않습니다 — flex 가 쉼표를 낱개 칸으로 만들어
     줄 사이에 떠다닙니다(문장을 흩어 놓는 실패). 칸 자체로 나눕니다. */
  .rsrc { display: flex; flex-wrap: wrap; align-items: center;
          gap: var(--sp-1); margin: var(--sp-1) 0 0; }
  .rsrc-label { font-size: var(--fs-caption); color: var(--text-subtle); }
  .rsrc a { display: inline-flex; align-items: center; justify-content: center;
            min-height: var(--tap); min-width: var(--tap);
            padding: 0 var(--sp-2); font-size: var(--fs-caption);
            font-variant-numeric: tabular-nums;
            color: var(--text-subtle); text-decoration: none;
            border: 1px solid var(--line); border-radius: var(--r-ctrl); }
  @media (hover: hover) and (pointer: fine) {
    .rsrc a:hover { color: var(--primary); border-color: var(--primary); }
  }

  /* 저장 버튼은 **보조**입니다 (브리프 §14). 이 화면의 주 행동은
     `회의를 열고 로비로` 하나뿐이고, 나머지는 값을 고친 뒤 눌러
     확정하는 것입니다. 여섯 개가 다 청록이면 주 행동이 사라집니다. */
  .panel > button:not(.primary) { font-size: var(--fs-label);
                                  padding: var(--sp-2) var(--sp-4); margin-top: var(--sp-4); }

  /* ⚠️ **작게 만드는 것은 마우스에서만입니다.** `--tap`(44px)은 손가락 끝
     접촉면이고 `app.css` 가 모든 버튼에 겁니다. 여기서 미디어 쿼리 밖에
     `min-height: 0` 을 적었더니 실제 폰 에뮬레이션에서 저장 버튼 다섯이
     40.1px 이었습니다. 칸반의 `.moves button` 이 쓰는 모양으로 맞춥니다. */
  @media (hover: hover) and (pointer: fine) {
    .panel > button:not(.primary) { min-height: 0; }
  }
</style>
</head>
<body>
  <!-- ⭐ **이 화면은 React 가 그립니다** (docs/19 §24).
       역할·GitHub 계정·초대 코드·회의 열기·설정·연결 진단·내 녹음 지우기가
       전부 `src/demo/project.tsx` 안에 있습니다. -->
  <div id="app"></div>

  <script type="module" src="/project.js"></script>

  <!-- 아래 탭바. `src/demo/nav.ts` 가 채운다.
       위쪽 링크 줄에 의존하면 전체화면 PWA·WebView 에서 갇힌다 —
       거기에는 주소창도 뒤로가기도 없다. -->
  <nav id="tabs" aria-label="주요 화면"></nav>
</body>
</html>
