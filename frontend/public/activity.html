<title>활동 기록 — TeamFlow</title>
<style>

  /* ══ 활동 기록 ═════════════════════════════════════════════

     ⚠️ 누르는 것은 **갈래와 거르개뿐**입니다. 기록을 고치거나 지우는
     요청은 0개입니다 — 감사 기록·저장소 기록은 나중에 확인하려고 있고,
     화면에서 고칠 수 있으면 그 목적이 통째로 사라집니다. */

  /* 갈래 — 팀 활동 / GitHub. 출처가 다른 두 흐름이라 섞지 않습니다. */
  .lanes { display: flex; gap: var(--sp-2); margin: var(--sp-4) 0 0; }
  .lanes button { min-height: var(--tap); padding: 0 var(--sp-4);
                  font-size: var(--fs-label); color: var(--text-muted);
                  background: none; border: 1px solid var(--line);
                  border-radius: .5rem; cursor: pointer; }
  .lanes button.on { color: var(--text); border-color: var(--primary);
                     font-weight: 600; }

  /* 종류 거르개. ⚠️ 건수는 글자입니다 — 폭·위치로 그리면 순위표입니다. */
  .gbar { display: flex; flex-wrap: wrap; gap: var(--sp-2);
          margin: 0 0 var(--sp-4); }
  .gbar button { min-height: var(--tap); padding: 0 var(--sp-3);
                 font-size: var(--fs-caption); color: var(--text-muted);
                 background: none; border: 1px solid var(--line);
                 border-radius: .5rem; cursor: pointer;
                 font-variant-numeric: tabular-nums; }
  .gbar button.on { color: var(--text); border-color: var(--primary); }

  /* 커밋이 없는 이유 · 빈 목록에서 갈 곳. 본문보다 낮게. */
  .gwhy, .gnext { max-width: 52rem; margin: var(--sp-5) 0 0;
                  font-size: var(--fs-caption); color: var(--text-subtle); }

  /* ⚠️ 줄마다 가로선을 긋지 않습니다 — 백 줄이면 선이 백하나가 되고,
     그 선들이 화면에서 가장 진한 것이 됩니다. */
  .alist { list-style: none; padding: 0; margin: 0; max-width: 52rem;
           display: grid; gap: var(--sp-3); }

  .aitem { display: flex; flex-wrap: wrap; align-items: baseline;
           gap: var(--sp-3); padding-left: var(--sp-3);
           /* 표시할 자리를 **늘 잡아 둡니다** — 안 그러면 줄이 옆으로 밀립니다. */
           border-left: 2px solid transparent; }

  /* 사람의 기여 숫자를 건드린 기록. ⚠️ 빨강이 아닙니다 — 잘못한 일이
     아니라 **되짚어 볼 일**입니다. 팀이 합의해 정한 것일 수 있습니다. */
  .aitem.weighty { border-left-color: var(--primary); }
  .aitem.weighty .awhat { font-weight: 600; }

  .awhen { flex: none; min-width: 8.5rem; font-size: var(--fs-caption);
           color: var(--text-subtle); font-variant-numeric: tabular-nums; }
  .awhat { font-size: var(--fs-label); color: var(--text); }
  .awho { font-size: var(--fs-caption); color: var(--text-muted); }

  /* 무엇을 바꿨는가. ⚠️ `meetings/3` 같은 식별자라 **가로로 넘칠 수**
     있습니다 — 줄바꿈을 허용합니다. */
  .atarget { font-size: var(--fs-caption); color: var(--text-subtle);
             overflow-wrap: anywhere; }

  @media (hover: none) and (pointer: coarse) {
    .awhat { font-size: 1rem; }
    .awhen, .awho, .atarget { font-size: .875rem; }
  }
        </style>
</head>
<body>
  <!-- ⭐ **이 화면은 React 가 그립니다** (docs/19 §24). -->
  <div id="app"></div>

  <script type="module" src="/activity.js"></script>

  <!-- 탭 넷 **말고** 가는 곳. `src/demo/nav.ts` 가 `navLinks` 로 채운다.
       ⛔ 이 자리를 지우면 채팅·일정·알림·활동·찾기·보고서로 **가는 길이
       제품 전체에서 사라집니다** — 실제로 그랬습니다 (결함 305). -->
  <nav id="nav" aria-label="더 보기"></nav>

  <nav id="tabs" aria-label="주요 화면"></nav>
</body>
