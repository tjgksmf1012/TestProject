<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161a" />
<!-- 홈 화면에 추가하면 주소창 없이 전체화면으로 뜬다. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TeamFlow" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/app.css" />
<title>회의 로비 — TeamFlow</title>
<style>


  /* 참가자 한 명 = 한 줄. 이름·상태가 위, 커버리지 막대가 아래.
     막대는 **한 줄을 통째로** 써야 42% 와 98% 의 차이가 보입니다. */
  li { display: grid; grid-template-columns: 6rem 1fr; gap: var(--sp-1) var(--sp-2);
       padding: var(--sp-2) 0; border-top: 1px solid var(--line); align-items: baseline; }
  li:first-child { border-top: 0; }
  .name { font-weight: 600; }
  .state { font-size: var(--fs-label); color: var(--text-subtle); }
  /* 트랙은 이름 칸 아래가 아니라 **상태 칸 아래**로. */
  li .tl { grid-column: 2; }

  /* 시간축 — 트랙과 같은 격자에 맞춘다. 안 맞으면 눈금이 가리키는
     시각이 트랙의 그 자리와 어긋난다. */
  .axis { display: grid; grid-template-columns: 6rem 1fr; gap: 0 var(--sp-2);
          margin: 0 0 var(--sp-1); font-size: var(--fs-caption); color: var(--text-subtle); }
  .axis .marks { display: flex; justify-content: space-between; }
  .granted { color: var(--ok); } .refused { color: var(--bad); } .pending { color: var(--warn); }
  .broken .state, .at_risk .state { color: var(--warn); }
  .broken .state { color: var(--bad); }

  button.primary:disabled { background: transparent; color: var(--text-subtle); border-color: var(--line); font-weight: 400; cursor: not-allowed; }
  button + button { margin-top: var(--sp-2); }
 .row button { margin-top: 0; }
  .blockers { margin: 0 0 var(--sp-3); padding: var(--sp-3) var(--sp-4); border-radius: .5rem; background: color-mix(in srgb, var(--warn) 12%, transparent); font-size: var(--fs-label); }
  .blockers p { margin: var(--sp-1) 0; }
  .status { font-size: var(--fs-label); color: var(--text-subtle); margin: var(--sp-3) 0 0; }
    </style>
</head>
<body>
  <h1 id="title">회의 로비</h1>
  <!-- 비워 둔다. 정적 "불러오는 중…" 은 **언제나** 한 번 깜빡입니다.
       로딩 표시는 `src/lib/ui/pending.ts` 가 200ms 뒤에 켭니다. -->
  <p class="sub" id="sub"></p>
  <p class="sub" id="who"></p>

  <section class="panel">
    <h2>동의</h2>
    <div id="blockers" class="blockers" hidden></div>
    <ul id="roster"></ul>
    <div class="row" style="margin-top:.75rem">
      <button id="agree" class="primary">동의합니다</button>
      <button id="refuse">거부</button>
    </div>
    <p class="status" id="consent-message"></p>
  </section>

  <section class="panel">
    <h2>참가자 상태</h2>
    <p id="axis" class="axis" hidden></p>
    <ul id="members"></ul>
    <p class="status" id="room-message"></p>
  </section>

  <section class="panel">
    <button id="record" class="primary" disabled>녹음 화면으로</button>
    <!-- 브라우저 통화 (docs/15). 각자 자기 PC 에서 회의할 때 여기로 들어간다. -->
    <button id="call" disabled>통화로 회의하기</button>
    <button id="finish" hidden>강제 종료</button>
    <button id="review" hidden>업무 후보 검토</button>
    <button id="kanban">칸반 보기</button>
    <button id="contrib">기여도 보기</button>
    <button id="logout">로그아웃</button>
  </section>

  <p class="note">
    주소에는 <code>?meeting=1</code> 만 붙습니다. <strong>내가 누구인지는
    서버가 세션에서 읽습니다</strong> — 예전에는 <code>?me=1</code> 로
    스스로 선언했고, 그래서 누구나 남을 사칭할 수 있었습니다.
  </p>

  <script type="module" src="/lobby.js"></script>

  <!-- 아래 탭바. `src/demo/nav.ts` 가 채운다.
       위쪽 링크 줄에 의존하면 전체화면 PWA·WebView 에서 갇힌다 —
       거기에는 주소창도 뒤로가기도 없다. -->
  <nav id="tabs" aria-label="주요 화면"></nav>
</body>
</html>
