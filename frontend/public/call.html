<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TeamFlow" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/app.css" />
<title>통화 — TeamFlow</title>
<style>

  /* ══ 브리프대로 (docs/19 §25) ═══════════════════════════════
     머리말은 `app.css` 의 `.head`·`.lede` — 화면 아홉이 같은 한 벌. */

  /* 통화 상태 한 줄. 이 화면에서 가장 먼저 읽히는 곳이다.
     ⚠️ 이건 `lede` 가 아니라 **지금 상태**입니다 — 설명문보다 진해야
     합니다. 그래서 머리말 안이 아니라 그 아래 제 자리에 둡니다. */
  #summary { font-size: var(--fs-label); font-weight: 600; color: var(--text);
             margin: 0 0 var(--sp-5); }

  /* 참가자. 얼굴이 없으므로 이름 첫 글자를 원으로 — 누가 있는지 한눈에.
     ⚠️ **줄마다 긋던 가로선을 걷었습니다** (브리프 §7). 세 사람이면
     선이 둘인데, 그 선이 이름보다 진했습니다. */
  .peers { list-style: none; padding: 0; margin: 0; }
  .peers li { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) 0; }
  /* 머리말의 `.by .avatar` 와 **같은 재료**입니다 — 한 제품에서 사람을
     그리는 방법이 둘이면 사람은 둘을 따로 배웁니다. */
  .face { width: var(--sp-8); height: var(--sp-8); border-radius: var(--r-round); flex: 0 0 auto;
          display: grid; place-items: center; font-weight: 700; font-size: var(--fs-label);
          background: var(--sunken); color: var(--text-muted); }
  .face.me { background: color-mix(in srgb, var(--primary) 14%, transparent);
             color: var(--primary); }
  .who { flex: 1; min-width: 0; }
  .who .name { font-weight: 600; }
  .who .state { display: block; font-size: var(--fs-label); color: var(--text-subtle); }
  .who .state.ok { color: var(--ok); }
  /* ⭐ **아직 안 된 것은 흙빛입니다** (docs/05 §5 · 브리프 §15).
     `연결하는 중` 이나 `마이크를 아직 안 켰음` 은 잘못이 아니라 순서상
     당연한 상태입니다. 노랑·빨강으로 칠하면 "네가 뭘 잘못했다" 로
     읽힙니다 — 로비의 끊긴 트랙에서 이미 같은 이유로 바꿨습니다. */
  .who .state.warn { color: var(--gap); }
  .who .state.bad { color: var(--bad); }
  /* 헤드폰을 안 쓴 사람 — 이게 그 사람 트랙에 남의 목소리를 섞는다. */
  /* 헤드폰을 안 쓴 사람 — 이게 그 사람 트랙에 남의 목소리를 섞습니다.
     ⚠️ 이것도 **잘못이 아니라 조건**이라 흙빛입니다. */
  .badge { font-size: var(--fs-caption); padding: var(--sp-1) var(--sp-2);
           border-radius: var(--r-badge); font-weight: 500;
           background: color-mix(in srgb, var(--gap) 14%, transparent); color: var(--gap); }

  .warnings { list-style: none; padding: 0; margin: var(--sp-4) 0 0; }
  .warnings li { position: relative; font-size: var(--fs-caption); color: var(--gap);
                 padding: var(--sp-1) 0 var(--sp-1) var(--sp-4); }
  .warnings li::before { content: ""; position: absolute; left: 0; top: 1em;
                         width: var(--sp-1); height: var(--sp-1);
                         border-radius: var(--r-round); background: currentColor; }

  /* 마이크 레벨. "내 소리가 들어가고 있나" 를 눈으로 확인하는 유일한 곳. */
  .meter { height: var(--sp-2); border-radius: var(--r-badge); margin-top: var(--sp-3);
           background: var(--sunken); overflow: hidden; }
  .meter span { display: block; height: 100%; width: 0;
                background: var(--ok); transition: width .1s linear; }

  /* ⚠️ **둘이 화면 폭을 반씩 채우고 있었습니다** (`flex: 1`). 통화에
     들어온 사람의 주 행동은 `녹음 화면으로` 하나이고, `나가기` 는
     끝낼 때만 씁니다 — 같은 크기의 빨간 상자로 늘 띄워 두면 화면이
     경고처럼 보이고 실수로 누를 자리도 넓어집니다 (브리프 §14). */
  .actionbar button { flex: 0 0 auto; }
  #leave { min-height: 0; padding: var(--sp-2) var(--sp-4); border-color: transparent;
           background: transparent; color: var(--text-subtle); font-weight: 500; }
  @media (hover: hover) and (pointer: fine) {
    #leave:hover { color: var(--bad); background: transparent; }
  }
  #status { font-size: var(--fs-label); color: var(--text-subtle); margin: var(--sp-3) 0 0; }
  #status.bad { color: var(--bad); }
</style>
</head>
<body class="has-actionbar">
  <header class="head">
    <h1>통화</h1>
    <p class="lede">
      각자 자기 기기에서 회의합니다. 녹음은 통화와 별개로 사람마다 따로 남습니다.
    </p>
    <p class="by" id="sub" hidden></p>
  </header>

  <p id="summary">연결하는 중…</p>

  <section class="panel">
    <h2>참가자</h2>
    <ul id="peers" class="peers"></ul>
    <ul id="warnings" class="warnings"></ul>
  </section>

  <section class="panel">
    <h2>내 마이크</h2>
    <p class="sub" id="mic">확인 중…</p>
    <!-- ⚠️ 이게 없으면 마이크가 죽은 걸 회의가 끝난 뒤에 안다.
         그때는 그 사람의 발언이 이미 사라진 뒤다. -->
    <div class="meter"><span id="level"></span></div>
  </section>

  <p id="status"></p>

  <div class="actionbar">
    <button id="record" class="primary">녹음 화면으로</button>
    <button id="leave" type="button">통화 나가기</button>
  </div>

  <nav id="tabs" aria-label="주요 화면"></nav>
  <script type="module" src="/call.js"></script>
</body>
</html>
