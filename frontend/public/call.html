<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TeamFlow" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/app.css" />
<title>통화 — TeamFlow</title>
<style>

  /* 통화 상태 한 줄. 이 화면에서 가장 먼저 읽히는 곳이다. */
  #summary { font-size: var(--fs-body); font-weight: 600; margin: 0 0 var(--sp-1); }
  #sub { margin-top: 0; }

  /* 참가자. 얼굴이 없으므로 이름 첫 글자를 원으로 — 누가 있는지 한눈에. */
  .peers { list-style: none; padding: 0; margin: 0; }
  .peers li { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) 0;
              border-top: 1px solid var(--line); }
  .peers li:first-child { border-top: 0; }
  .face { width: 2.25rem; height: 2.25rem; border-radius: 50%; flex: 0 0 auto;
          display: grid; place-items: center; font-weight: 700; font-size: var(--fs-body);
          background: color-mix(in srgb, var(--text) 10%, transparent); }
  .face.me { background: color-mix(in srgb, var(--ok) 22%, transparent); }
  .who { flex: 1; min-width: 0; }
  .who .name { font-weight: 600; }
  .who .state { display: block; font-size: var(--fs-label); color: var(--text-subtle); }
  .who .state.ok { color: var(--ok); }
  .who .state.warn { color: var(--warn); }
  .who .state.bad { color: var(--bad); }
  /* 헤드폰을 안 쓴 사람 — 이게 그 사람 트랙에 남의 목소리를 섞는다. */
  .badge { font-size: var(--fs-caption); padding: var(--sp-1) .5rem; border-radius: 1rem;
           background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }

  .warnings { list-style: none; padding: 0; margin: var(--sp-3) 0 0; }
  .warnings li { font-size: var(--fs-label); color: var(--warn); padding: var(--sp-1) 0; }
  .warnings li::before { content: "⚠ "; }

  /* 마이크 레벨. "내 소리가 들어가고 있나" 를 눈으로 확인하는 유일한 곳. */
  .meter { height: .5rem; border-radius: .25rem; margin-top: var(--sp-2);
           background: color-mix(in srgb, var(--text) 10%, transparent); overflow: hidden; }
  .meter span { display: block; height: 100%; width: 0;
                background: var(--ok); transition: width .1s linear; }

  .actionbar button { flex: 1; }
  #leave { border-color: var(--bad); color: var(--bad); }
  #status { font-size: var(--fs-label); color: var(--text-subtle); margin: var(--sp-3) 0 0; }
  #status.bad { color: var(--bad); }
</style>
</head>
<body class="has-actionbar">
  <h1>통화</h1>
  <p id="summary">연결하는 중…</p>
  <p class="sub" id="sub"></p>

  <section class="panel">
    <h2>참가자</h2>
    <ul id="peers" class="peers"></ul>
    <ul id="warnings" class="warnings"></ul>
  </section>

  <section class="panel">
    <h2>내 마이크</h2>
    <p class="sub" id="mic">확인 중…</p>
    <!-- ⚠️ 이게 없으면 마이크가 죽은 걸 회의가 끝난 뒤에 안다.
         그때는 그 사람의 발언이 이미 사라진 뒤다. -->
    <div class="meter"><span id="level"></span></div>
  </section>

  <p id="status"></p>

  <div class="actionbar">
    <button id="record" class="primary">녹음 화면으로</button>
    <button id="leave" type="button">통화 나가기</button>
  </div>

  <nav id="tabs" aria-label="주요 화면"></nav>
  <script type="module" src="/call.js"></script>
</body>
</html>
