<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161a" />
<!-- 홈 화면에 추가하면 주소창 없이 전체화면으로 뜬다. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TeamFlow" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/app.css" />
    <title>업무 후보 검토 — TeamFlow AI</title>
    <style>

      /* ══ 브리프대로 다시 짰습니다 (docs/19 §21) ═══════════════════

         고친 것은 장식이 아니라 **순서**입니다. 이 화면에서 사람이 하는
         일은 하나입니다 — 후보 하나를 보고 등록할지 정하기. 그런데
         화면은 그 일을 맨 아래에 두고, 위쪽 넉 줄을 회의록에 썼고,
         카드 안에서는 제목보다 `34%` 가 컸습니다.

         그래서 위에서부터: 무엇을 하는 화면인가(머리말) → 얼마나
         남았나(탭) → 후보 하나(카드) → 결정(버튼). 회의 맥락은 접습니다. */

      /* ── 머리말 ─────────────────────────────────────────── */
      .head { margin-bottom: var(--sp-6); }
      .lede { color: var(--text-muted); font-size: var(--fs-label);
              max-width: 64ch; margin: 0; }
      /* 검토자는 **문장이 아니라 꼬리표**입니다. "김민수 님이 검토하고
         있습니다" 는 설명문과 같은 크기라 설명을 두 번 읽게 만들었습니다. */
      .by { display: flex; align-items: center; gap: var(--sp-2);
            margin: var(--sp-3) 0 0; font-size: var(--fs-caption); color: var(--text-subtle); }
      .by .avatar {
        display: grid; place-items: center;
        width: var(--sp-5); height: var(--sp-5); border-radius: var(--r-round);
        background: color-mix(in srgb, var(--primary) 14%, transparent);
        color: var(--primary); font-size: var(--fs-caption); font-weight: 700;
      }

      /* ── 회의 맥락 (접힘) ───────────────────────────────── */
      .brief { border: 1px solid var(--line); border-radius: var(--r-card);
               background: var(--surface); margin-bottom: var(--sp-6); }
      .brief > summary {
        display: flex; align-items: center; justify-content: space-between;
        gap: var(--sp-4); padding: var(--sp-3) var(--sp-4);
        list-style: none; cursor: pointer; border-radius: var(--r-card);
        font-size: var(--fs-label);
      }
      .brief > summary::-webkit-details-marker { display: none; }
      .brief-line { color: var(--text); font-weight: 600; }
      .brief-cta { color: var(--text-subtle); white-space: nowrap; }
      /* 열렸다는 것을 **화살표 방향**으로 말합니다 — 글자를 바꾸면 같은
         자리에서 문구가 튀고, 접기·펴기가 다른 버튼처럼 보입니다. */
      .brief-cta::after { content: " \203a"; display: inline-block; transition: transform .12s ease; }
      .brief[open] .brief-cta::after { transform: rotate(90deg); }
      .brief[open] > summary { border-bottom: 1px solid var(--line);
                               border-radius: var(--r-card) var(--r-card) 0 0; }
      .brief-body { padding: var(--sp-4); }
      #meeting-summary { white-space: pre-wrap; font-size: var(--fs-label);
                         line-height: 1.7; color: var(--text-muted); margin: 0; }
      .minutes-head { font-size: var(--fs-caption); font-weight: 600; color: var(--text-subtle);
                      letter-spacing: .02em; margin: var(--sp-5) 0 var(--sp-2); }
      /* ⚠️ **줄마다 가로선을 긋지 않습니다** (브리프 §7). 안건 셋에 선이
         셋이면 화면을 가로지르는 줄이 셋 생기고, 그 선들이 카드 목록의
         테두리와 경쟁합니다. 나누는 일은 여백이 합니다. */
      #agenda, #issues { list-style: none; padding: 0; margin: 0;
                         font-size: var(--fs-label); color: var(--text-muted); }
      #agenda li, #issues li { display: flex; gap: var(--sp-2); align-items: baseline;
                               flex-wrap: wrap; padding: var(--sp-1) 0; }
      #agenda li::before { content: "\2013"; color: var(--text-subtle); }
      #issues .at { font-variant-numeric: tabular-nums; font-size: var(--fs-caption);
                    color: var(--text-subtle); white-space: nowrap; }
      /* ⚠️ `flex: 1` 을 주면 안 됩니다. 넓은 화면에서 내용 칸이 늘어나
       * "근거 발화 1건" 이 **1000px 떨어진 오른쪽 끝**으로 밀려납니다 —
       * 무엇의 근거인지 안 보이고 표의 다른 열처럼 읽힙니다. */
      #issues .what { flex: 0 1 auto; min-width: 0; }
      /* ⚠️ 근거 건수는 **작게, 그러나 지우지 않고** 둡니다. 이 저장소는
       * 근거 없는 값을 화면에 올리지 않기로 했고, 그 약속은 사람이
       * 근거의 유무를 볼 수 있을 때만 지켜집니다. */
      #issues .why { font-size: var(--fs-caption); color: var(--text-subtle); white-space: nowrap; }
      #issues .why.none { color: var(--gap); }

      /* ── 상태 필터 ──────────────────────────────────────── */
      .seg { display: flex; gap: var(--sp-1); flex-wrap: wrap;
             margin-bottom: var(--sp-4); }
      .seg button {
        min-height: 0; font-size: var(--fs-label); font-weight: 500;
        padding: var(--sp-2) var(--sp-3);
        border: 1px solid transparent; border-radius: var(--r-ctrl);
        background: transparent; color: var(--text-muted);
      }
      .seg button .n { font-variant-numeric: tabular-nums; color: var(--text-subtle);
                       margin-left: var(--sp-2); }
      .seg button[aria-selected="true"] {
        background: var(--surface); border-color: var(--line);
        color: var(--text); font-weight: 600;
      }
      .seg button[aria-selected="true"] .n { color: var(--text-muted); }
      .lane-empty { font-size: var(--fs-label); color: var(--text-subtle);
                    padding: var(--sp-8) 0; text-align: center; margin: 0; }

      /* ── 후보 카드 ──────────────────────────────────────── */
      /* 떠오른 면 + 1px. 그림자를 안 쓰는 것은 이 저장소의 규칙입니다
         (`guards.test.ts` 가 컨트롤 경계를 봅니다). */
      .cand {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--r-card); padding: var(--sp-5);
        margin-bottom: var(--sp-3);
        transition: border-color .12s ease;
      }
      /* 결정한 것은 **테두리로만** 말합니다. 카드 전체를 물들이면 목록에
         색 덩어리가 생기고, 아직 안 본 것이 그 사이에 묻힙니다. */
      .cand[data-decision="approve"] { border-color: var(--primary); }
      .cand[data-decision="reject"] { opacity: .55; }
      .cand[data-done="1"] { background: var(--bg); }

      .cand-top { display: flex; gap: var(--sp-3); align-items: flex-start;
                  margin-bottom: var(--sp-4); }
      /* 제목은 **입력창처럼 보이지 않습니다.** 눌러야 테두리가 나옵니다 —
         카드가 HTML 폼처럼 보이던 가장 큰 이유가 이 상자였습니다. */
      /* ⚠️ **`.cand .title` 로는 안 먹습니다.** app.css 의
         `input:not([type='checkbox']):not([type='radio'])` 는 특성도가 (0,2,1) 이고
         `.cand .title` 은 (0,2,0) 이라 **app.css 가 이깁니다.** 렌더해서
         보고 알았습니다 — 제목이 여전히 회색 입력 상자였습니다.
         `input` 을 붙여 (0,2,1) 로 맞추면 나중에 오는 이쪽이 이깁니다. */
      .cand input.title {
        flex: 1; min-width: 0; font: inherit; font-size: var(--fs-item); font-weight: 600;
        min-height: 0; padding: var(--sp-1) var(--sp-2);
        margin-left: calc(-1 * var(--sp-2));
        border: 1px solid transparent; border-radius: var(--r-ctrl);
        background: transparent; color: var(--text);
      }
      @media (hover: hover) and (pointer: fine) {
        .cand input.title:hover:not(:disabled) { border-color: var(--line); }
      }
      .cand input.title:focus { border-color: var(--line-strong); background: var(--bg); }
      .cand input.title:disabled { color: var(--text-muted); }

      /* ⭐ **`34%` 를 걷어냈습니다** (브리프 §11).
         48px 짜리 숫자가 제목보다 커서, 화면에서 제일 먼저 읽히는 것이
         "이 업무가 무엇인가" 가 아니라 백분율이었습니다. 확신도는 제목을
         **읽고 나서** 참고하는 값입니다. 그래서 제목 옆 작은 알약으로. */
      .badge {
        flex: 0 0 auto; font-size: var(--fs-caption); font-weight: 600;
        font-variant-numeric: tabular-nums; line-height: 1;
        padding: var(--sp-2) var(--sp-2); border-radius: var(--r-ctrl);
        background: color-mix(in srgb, var(--primary) 10%, transparent);
        color: var(--primary);
      }
      /* 확신도가 낮은 것은 결측과 같은 흙빛입니다 — 빨강이 아닙니다.
         AI 가 확신을 못 한 것은 고장이 아니라 "여기는 사람이 봐야 한다". */
      .badge.low { background: color-mix(in srgb, var(--gap) 14%, transparent); color: var(--gap); }

      /* ── 담당자·마감일 ──────────────────────────────────── */
      /* 라벨 글자를 지우고 아이콘으로 대신합니다. `담당자 [담당자 미지정]`
         은 같은 말을 두 번 하는 것이었습니다. */
      .fields { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
      .field { display: inline-flex; align-items: center; gap: var(--sp-icon);
               position: relative; color: var(--text-muted); }
      .field > .ico { position: absolute; left: var(--sp-3); display: inline-flex;
                      pointer-events: none; color: var(--text-subtle); }
      .field .ico svg { --ico: 15px; width: var(--ico); height: var(--ico); }
      .field select, .field input[type="date"] {
        width: auto; min-width: 0; font-size: var(--fs-label);
        min-height: 0; padding: var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-8);
        border: 1px solid var(--line); border-radius: var(--r-ctrl);
        background: var(--bg); color: var(--text);
        /* 기본 화살표를 끄고 우리 것을 씁니다 — UA 위젯은 브라우저마다
           달라서, 같은 화면이 크롬과 사파리에서 다르게 보입니다. */
        appearance: none; -webkit-appearance: none;
      }
      .field.sel select { padding-right: var(--sp-8); }
      .field.sel::after {
        content: ""; position: absolute; right: var(--sp-3); pointer-events: none;
        width: var(--sp-2); height: var(--sp-2); border: 1px solid var(--text-subtle);
        border-width: 0 1px 1px 0; transform: translateY(-2px) rotate(45deg);
      }
      /* ⚠️ 날짜 칸의 달력 버튼은 **지우지 않습니다.** 지우면 키보드로만
         입력해야 하고, `mm/dd/yyyy` 를 손으로 치는 것은 이 화면에서 가장
         자주 하는 일입니다. 색만 우리 것으로 맞춥니다. */
      .field input[type="date"]::-webkit-calendar-picker-indicator { opacity: .55; }
      .field select:focus-visible, .field input:focus-visible { border-color: var(--primary); }
      /* 아직 안 고른 칸은 **글자를 죽여** 채워진 칸과 구분합니다. */
      .field[data-empty="1"] select, .field[data-empty="1"] input { color: var(--text-subtle); }
      .field select:disabled, .field input:disabled { background: transparent; border-color: transparent; }
      .field[data-empty="1"] > .ico { color: var(--gap); }

      /* 근거 — 카드에서 가장 조용한 줄. 그러나 지우지 않습니다. */
      /* 근거는 줄 **끝**으로 보냅니다. 담당자·마감일 옆에 붙여 뒀더니
         카드 오른쪽 절반이 통째로 비었습니다 (렌더해서 봤습니다). */
      .src { margin-left: auto; font-size: var(--fs-caption);
             color: var(--text-subtle); white-space: nowrap; }
      .src.none { color: var(--bad); }
      .hint { font-size: var(--fs-caption); color: var(--text-muted); margin: var(--sp-3) 0 0; }

      /* ── 한 줄 검사 (브리프 §13) ────────────────────────── */
      /* ⚠️ 예전에는 막는 이유를 **한 줄에 하나씩 전부 빨갛게** 적었습니다.
         후보 셋이면 빨간 줄이 여섯인데, 그중 넷은 "아직 안 골랐다" 였습니다.
         진짜 문제(회의에 없던 내용)가 그 사이에서 안 보였습니다. */
      .check { font-size: var(--fs-caption); margin: var(--sp-3) 0 0;
               display: flex; gap: var(--sp-2); align-items: baseline; }
      .check::before { content: ""; flex: 0 0 auto;
                       width: var(--sp-1); height: var(--sp-1); border-radius: var(--r-round);
                       background: currentColor; transform: translateY(-3px); }
      .check[data-tone="missing"] { color: var(--gap); }
      .check[data-tone="error"] { color: var(--bad); }

      /* 서버가 확신 못 한 기록. 승인을 막지는 않으므로 **접습니다.** */
      .why-not { margin: var(--sp-3) 0 0; }
      .why-not > summary { font-size: var(--fs-caption); color: var(--text-subtle);
                           cursor: pointer; list-style: none; }
      .why-not > summary::-webkit-details-marker { display: none; }
      .why-not > summary::after { content: " \203a"; display: inline-block; }
      .why-not[open] > summary::after { transform: rotate(90deg); }
      .why-not ul { list-style: none; padding: 0;
                    margin: var(--sp-2) 0 0; font-size: var(--fs-caption); color: var(--text-muted); }
      .why-not li { padding: var(--sp-1) 0; }
      .why-not li::before { content: "\2013 "; color: var(--text-subtle); }

      /* ── 버튼 위계 (브리프 §14) ─────────────────────────── */
      /* 예전에는 `승인 / 거절 / 보류` 가 **똑같이 생긴 상자 셋**이었습니다.
         셋 다 같은 무게면 사람은 셋 다 읽어야 합니다. 이 화면의 주된
         행동은 하나입니다 — 등록. */
      .acts { display: flex; gap: var(--sp-2); align-items: center;
              margin-top: var(--sp-5); flex-wrap: wrap; }
      .acts button { min-height: 0; font-size: var(--fs-label);
                     padding: var(--sp-2) var(--sp-4); }
      .acts .approve { background: var(--primary); border-color: var(--primary);
                       color: var(--primary-fg); font-weight: 600; }
      .acts .clear { background: transparent; border-color: var(--line-strong);
                     color: var(--text-muted); font-weight: 500; }
      /* 거절은 **글자만**입니다. 빨간 상자를 늘 띄워 두면 화면이 경고처럼
         보이고, 실수로 누를 자리도 넓어집니다. */
      /* ⚠️ 처음엔 `margin-left: auto` 로 오른쪽 끝에 보냈는데, 1024px
         폭에서 **다른 버튼과 550px 떨어져** 같은 줄로 안 읽혔습니다.
         위계는 거리가 아니라 무게로 만듭니다. */
      .acts .reject { background: transparent; border-color: transparent;
                      color: var(--text-subtle); font-weight: 500; }
      @media (hover: hover) and (pointer: fine) {
        .acts .reject:hover:not(:disabled) { color: var(--bad); background: transparent; }
      }
      .acts .reject.on { background: transparent; color: var(--bad); font-weight: 600; }
      .acts .clear.on { border-color: var(--text-muted); color: var(--text); }
      .done { font-size: var(--fs-caption); color: var(--text-subtle); margin: var(--sp-4) 0 0; }

      .cand input.memo {
        font: inherit; font-size: var(--fs-label); min-height: 0;
        margin-top: var(--sp-3); padding: var(--sp-2) var(--sp-3);
        border: 1px solid var(--line); border-radius: var(--r-ctrl);
        background: var(--bg); color: var(--text);
      }

      /* 제출 막대. app.css 의 `.actionbar` 가 자리(탭바 바로 위 +
         홈 인디케이터 여백)를 잡고, 여기서는 안에 든 것만 배치한다. */
      .actionbar .inner { align-items: center; }
      #result { flex: 1; font-size: var(--fs-label); color: var(--text-muted); }
      #submit { flex: 0 0 auto; min-width: 7rem; }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
        </style>
  </head>
  <body class="has-actionbar">
    <!-- ⭐ 제품 머리말 (브리프 §5). 제목·설명·검토자가 **한 덩어리**로
         읽혀야 합니다. 예전에는 셋이 각각 문단이라 화면 위쪽 넉 줄이
         전부 비슷한 무게였습니다. -->
    <header class="head">
      <h1>업무 후보 검토</h1>
      <p class="lede">
        AI가 회의에서 뽑은 후보입니다. 등록해야 칸반에 올라갑니다.
      </p>
      <p class="by" id="who" hidden></p>
    </header>

    <!-- ⭐ 회의 맥락은 **접어 둡니다** (브리프 §6).
         요약·다음 안건·답 안 난 것이 전부 펼쳐져 있으면, 정작 이 화면에서
         할 일(후보 판단)보다 읽을거리가 먼저 옵니다. 접되 **지우지
         않습니다** — 한 번의 클릭 안에 둡니다.

         ⚠️ 회의록은 요약 하나가 아닙니다 (결함 110·111). 다음 안건과
         미해결 사안도 LLM 이 만들고 검증까지 통과한 산출물인데, 그리는
         곳이 저장소에 0곳이라 DB 에만 남아 있었습니다. -->
    <details class="brief" id="brief" hidden>
      <summary>
        <span class="brief-line" id="brief-line"></span>
        <span class="brief-cta">회의 내용 보기</span>
      </summary>
      <div class="brief-body">
        <p id="meeting-summary" hidden></p>
        <div id="agenda-block" hidden>
          <h2 class="minutes-head">다음 회의에서 다룰 안건</h2>
          <ul id="agenda"></ul>
        </div>
        <div id="issues-block" hidden>
          <h2 class="minutes-head">회의에서 답이 안 난 것</h2>
          <ul id="issues"></ul>
        </div>
      </div>
    </details>

    <!-- 상태 필터 (브리프 §8). `src/demo/review.ts` 가 채운다.
         ⚠️ **세기만 하고 거르지 않는 탭은 거짓말입니다.** 예전 `#counts`
         는 개수만 적은 한 줄이었는데, 그걸 탭 모양으로 그려 놓고 눌러도
         아무 일이 안 일어나면 사람은 앱이 고장 났다고 읽습니다. -->
    <div class="seg" id="lanes" role="tablist" aria-label="검토 상태"></div>

    <div id="list"></div>

      </div>
