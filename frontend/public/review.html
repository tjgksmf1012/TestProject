<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161a" />
<!-- 홈 화면에 추가하면 주소창 없이 전체화면으로 뜬다. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TeamFlow" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="stylesheet" href="/app.css" />
    <title>업무 후보 검토 — TeamFlow AI</title>
    <style>

      .banner { padding: .7rem .9rem; border-radius: .5rem; font-size: .875rem; margin-bottom: .75rem; }
      #attention { background: color-mix(in srgb, var(--warn) 15%, transparent); }
      #blocked { background: color-mix(in srgb, var(--bad) 12%, transparent); }
      #counts { font-size: .875rem; opacity: .75; margin-bottom: 1rem; }

      .card {
        border: 1px solid var(--line); border-radius: .75rem;
        padding: 1rem; margin-bottom: .85rem;
      }
      .card[data-decision="approve"] { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 6%, transparent); }
      .card[data-decision="reject"] { border-color: var(--line); opacity: .6; }
      .card header { display: flex; gap: .75rem; align-items: center; margin-bottom: .75rem; }
      .card header .title {
        flex: 1; font: inherit; font-weight: 600; padding: .4rem .5rem;
        border: 1px solid transparent; border-radius: .35rem; background: var(--soft); color: inherit;
      }
      .card header .title:focus { border-color: var(--line); outline: none; }
      .conf { font-size: .75rem; white-space: nowrap; opacity: .7; font-variant-numeric: tabular-nums; }
      .conf.low { color: var(--warn); opacity: 1; font-weight: 700; }

      .row label { font-size: .8rem; opacity: .75; display: flex; gap: .35rem; align-items: center; }
      /* ⭐ 글자를 16px 밑으로 내리지 않는다. iOS Safari 는 그보다 작은
         입력 칸에 포커스가 가면 화면을 확대하고 **확대된 채로 돌아오지
         않는다.** 승인 화면은 담당자 고르기·마감일 넣기가 전부 입력이라
         그 화면에서 가장 자주 밟는다. 크기는 app.css 가 정한다. */
      select, input[type="date"] { width: auto; min-width: 8rem; }
      .note { font: inherit; font-size: 1rem; padding: .6rem .75rem;
        border: 1px solid var(--line); border-radius: var(--radius-sm);
        background: var(--bg); color: inherit; }

      .evidence { font-size: .8rem; opacity: .75; margin: .4rem 0; }
      .evidence code { font-size: .95em; }
      .evidence .bad { color: var(--bad); opacity: 1; }

      .blockers { list-style: none; padding: 0; margin: .5rem 0; font-size: .8rem; color: var(--bad); }
      .blockers li::before { content: "⚠ "; }

      /* 승인을 막는 것(blockers)과 서버가 확신 못 한 것(warnings)은 다르다.
         색을 나눠야 사람이 "지금 고쳐야 할 것" 과 "확인해 볼 것" 을 구분한다. */
      .warnings { list-style: none; padding: 0; margin: .5rem 0; font-size: .8rem; color: var(--warn, #b45309); }
      .warnings li::before { content: "· "; }
      .hint { font-size: .8rem; margin: .4rem 0; opacity: .85; }

      #meeting-summary {
        white-space: pre-wrap; font-size: .875rem; line-height: 1.65;
        border-left: 3px solid var(--line, #d8dbe0); padding: .25rem 0 .25rem .875rem;
        margin: 0 0 1rem;
      }

      .actions { display: flex; gap: .5rem; margin-top: .75rem; }
      .actions button {
        font: inherit; font-size: .875rem; padding: .45rem .9rem; cursor: pointer;
        border: 1px solid var(--line); border-radius: .4rem;
        background: transparent; color: inherit;
      }
      .actions button:disabled { opacity: .35; cursor: not-allowed; }
      .actions .approve.on { background: var(--ok); color: #fff; border-color: transparent; }
      .actions .reject.on { background: var(--bad); color: #fff; border-color: transparent; }
      .done { font-size: .8rem; opacity: .6; margin: .5rem 0 0; }

      /* 제출 막대. app.css 의 `.actionbar` 가 자리(탭바 바로 위 +
         홈 인디케이터 여백)를 잡고, 여기서는 안에 든 것만 배치한다.
         예전에는 `bottom: 0` 이라 탭바와 겹쳤다. */
      .actionbar .inner { align-items: center; }
      #result { flex: 1; font-size: .8125rem; }
      #submit { flex: 0 0 auto; min-width: 7rem; }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .note-block { font-size: .8rem; opacity: .7; margin-top: 1.5rem; }
    </style>
  </head>
  <body class="has-actionbar">
    <h1>업무 후보 검토</h1>
    <p class="sub">
      AI가 회의에서 뽑은 <strong>후보</strong>입니다. 승인해야 칸반에 등록됩니다.
      확신도가 낮은 것부터 보입니다.
    </p>

    <p class="sub" id="who"></p>

    <p id="meeting-summary" hidden></p>

    <div id="attention" class="banner" hidden></div>
    <div id="blocked" class="banner" hidden></div>
    <p id="counts"></p>

    <div id="list"></div>

    <p class="note-block">
      근거 발화가 없는 후보는 승인할 수 없습니다. 담당자·마감일을 채워도
      마찬가지입니다 — 회의에 없던 내용을 사람이 "고쳐서" 통과시키는 경로를
      만들면 안 되기 때문입니다.
    </p>

    <div class="actionbar">
      <div class="inner">
        <div id="result"></div>
        <button id="submit" class="primary" disabled>제출</button>
      </div>
    </div>

    <script type="module" src="./review.js"></script>

  <!-- 아래 탭바. `src/demo/nav.ts` 가 채운다.
       위쪽 링크 줄에 의존하면 전체화면 PWA·WebView 에서 갇힌다 —
       거기에는 주소창도 뒤로가기도 없다. -->
  <nav id="tabs" aria-label="주요 화면"></nav>
  </body>
</html>
